<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Performance Management — Under konstruktion</title>
  <style>
    :root {
      --bg1: #1b2a4a;
      --bg2: #24405f;
      --accent: #f0b429;
      --text: #f5f7fa;
      --muted: #b9c4d4;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.25rem;
      color: var(--text);
      background: radial-gradient(circle at 30% 20%, var(--bg2), var(--bg1) 70%);
      text-align: center;
    }

    .card {
      max-width: 640px;
      width: 100%;
    }

    .cover {
      width: 100%;
      max-width: 380px;
      aspect-ratio: 1 / 1;
      border-radius: 18px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
      display: block;
      margin: 0 auto 2rem;
    }

    .badge {
      display: inline-block;
      background: var(--accent);
      color: #1b2a4a;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-size: 0.8rem;
      padding: 0.5rem 1rem;
      border-radius: 999px;
      margin-bottom: 1.25rem;
    }

    h1 {
      font-size: clamp(1.6rem, 4vw, 2.4rem);
      line-height: 1.2;
      margin-bottom: 0.75rem;
    }

    p {
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.6;
      max-width: 460px;
      margin: 0 auto;
    }

    .footer {
      margin-top: 2.5rem;
      font-size: 0.85rem;
      color: var(--muted);
      opacity: 0.75;
    }

    @media (max-width: 480px) {
      .cover { max-width: 280px; }
    }
  </style>
</head>
<body>
  <main class="card">
    <img class="cover" src="cover_image.jpg" alt="Performance Management — forsidebillede">
    <span class="badge">🚧 Under konstruktion</span>
    <h1>Performance Management</h1>
    <p>
      Denne hjemmeside er stadig under opbygning. Kig forbi igen snart —
      der er mere på vej.
    </p>
    <div class="footer">© Peter Malmkjær</div>
  </main>
</body>
</html>
